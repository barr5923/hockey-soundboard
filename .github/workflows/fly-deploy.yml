name: Deploy to fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reset_admin_password:
        description: Reset the admin password to the SOUNDBOARD_ADMIN_PASSWORD secret
        type: boolean
        default: false

concurrency: fly-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: hockey-soundboard
      FLY_REGION: lax
      ADMIN_PW: ${{ secrets.SOUNDBOARD_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Ensure data volume exists
        run: |
          if ! flyctl volumes list -a "$FLY_APP" --json | grep -q '"name": *"soundboard_data"'; then
            flyctl volumes create soundboard_data --size 1 --region "$FLY_REGION" -a "$FLY_APP" --yes
          fi
      - name: Remove old machines without a data volume
        run: |
          flyctl machines list -a "$FLY_APP" --json \
            | jq -r '.[] | select(((.config.mounts // []) | length) == 0) | .id' \
            | xargs -r -n1 flyctl machines destroy --force -a "$FLY_APP"
      - name: Sync admin password secret
        if: ${{ env.ADMIN_PW != '' }}
        run: flyctl secrets set SOUNDBOARD_ADMIN_PASSWORD="$ADMIN_PW" --stage -a "$FLY_APP"
      - name: Ensure public IPs exist
        run: |
          if [ "$(flyctl ips list -a "$FLY_APP" --json | jq length)" = "0" ]; then
            flyctl ips allocate-v4 --shared -a "$FLY_APP"
            flyctl ips allocate-v6 -a "$FLY_APP"
          fi
      - name: Deploy (single machine, SQLite on volume)
        run: flyctl deploy --remote-only --ha=false -a "$FLY_APP"
      - name: Reset admin password
        if: ${{ inputs.reset_admin_password && env.ADMIN_PW != '' }}
        run: |
          MACHINE=$(flyctl machines list -a "$FLY_APP" --json | jq -r '.[0].id')
          flyctl machines start "$MACHINE" -a "$FLY_APP" || true
          sleep 5
          flyctl ssh console -a "$FLY_APP" --machine "$MACHINE" -C "python /app/server.py --reset-admin-password"
