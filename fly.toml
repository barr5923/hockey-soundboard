app = "hockey-soundboard"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  SOUNDBOARD_DB = "/data/soundboard-users.db"
  SOUNDBOARD_PUBLIC_URL = "https://hockey-soundboard.fly.dev"

[[mounts]]
  source = "soundboard_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
